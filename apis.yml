aid: aviate
name: Aviate
description: 'Aviate was an "intelligent homescreen" launcher for Android, built by
  ThumbsUp Labs (founded 2011 by Paul Montoy-Wilson, William Choi, and Mark Daiss).
  The app reorganized a phone home screen contextually — surfacing apps, contacts,
  and information based on time, location, and activity. It raised a $1.8M seed round
  in May 2013 from Highland Capital Partners, Andreessen Horowitz, Freestyle Capital,
  and Draper Associates, and was acquired by Yahoo in January 2014. Yahoo discontinued
  the Aviate launcher on March 8, 2018. The company is defunct: it never shipped a
  public API, developer portal, or SDK, aviate.com is now a parked domain listed for
  sale, aviate.yahoo.com redirects to downloads.yahoo.com, and the ThumbsUp Labs GitHub
  organization has no public repositories.'
